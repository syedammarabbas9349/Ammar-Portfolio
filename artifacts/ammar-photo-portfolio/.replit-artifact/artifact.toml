kind = "web"
previewPath = "/"
title = "Ammar Photography Portfolio"
description = "A monochrome photography portfolio for Ammar, with an editorial gallery, personal about section, and contact details."
version = "1.0.0"
id = "artifacts/ammar-photo-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21762

[services.development]
run = "pnpm --filter @workspace/ammar-photo-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ammar-photo-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ammar-photo-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21762"
BASE_PATH = "/"
